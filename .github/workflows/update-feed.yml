# วางไฟล์นี้ที่ .github/workflows/update-feed.yml ใน repository
name: Update football feed

on:
  schedule:
    - cron: "*/30 * * * *"   # ทุก 30 นาที (เวลา UTC; GitHub อาจเลื่อนช้าได้บ้าง)
  workflow_dispatch:          # ให้กดรันเองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # เก็บคำแปลและข้อมูลรอบก่อนไว้ข้ามรอบ (ไม่แปลซ้ำ และมีข้อมูลสำรองเมื่อ YouTube ดึงไม่ได้)
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            data/translations.json
            data/feed.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - name: Build feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_feed.py

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/feed.json _site/data/feed.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
